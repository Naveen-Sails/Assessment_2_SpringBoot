$kind: http-request
name: "Checkout - nonexistent product ID (expected current behavior: HTTP 500)"
description: The current global exception handler maps a missing product to HTTP 500; consider this an error-handling gap, not a successful result.
url: "{{baseUrl}}/checkout"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Test",
      "lastName": "User",
      "email": "test@example.com",
      "shippingAddress": "1 Test Street",
      "creditCard": "1234567812345678",
      "products": [
        { "productId": {{missingProductId}}, "quantity": 1 }
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test('Nonexistent product currently returns HTTP 500', function () { pm.response.to.have.status(500); });
    language: text/javascript
order: 7000
