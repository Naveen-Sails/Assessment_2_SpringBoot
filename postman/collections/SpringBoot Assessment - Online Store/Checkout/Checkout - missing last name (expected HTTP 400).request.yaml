$kind: http-request
url: "{{baseUrl}}/checkout"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Test",
      "email": "test@example.com",
      "shippingAddress": "1 Test Street",
      "creditCard": "1234567812345678",
      "products": [
        { "productId": {{productId}}, "quantity": 1 }
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test('Missing last name returns HTTP 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 4000
